<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Secure AI Agent</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 800px;
      }

      h1 {
        color: #22d3ee;
        text-align: center;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
      }

      .card {
        background: #1e293b;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      }

      input,
      textarea {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #0f172a;
        color: white;
        outline: none;
        margin-top: 10px;
      }

      button {
        margin-top: 15px;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        background: #22d3ee;
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #06b6d4;
      }

      #chat {
        margin-top: 25px;
        min-height: 250px;
        max-height: 400px;
        overflow-y: auto;
        padding: 15px;
        background: #0f172a;
        border-radius: 10px;
      }

      .message {
        margin-bottom: 15px;
      }

      .user {
        color: #22d3ee;
      }

      .agent {
        color: #cbd5e1;
      }

      .status {
        margin-top: 15px;
        padding: 10px 14px;
        border-radius: 8px;
        background: #0f172a;
        color: #94a3b8;
        font-size: 14px;
        text-align: center;
      }

      .message {
        margin-bottom: 18px;
      }

      .message-label {
        font-size: 13px;
        font-weight: 600;
        color: #94a3b8;
        margin-bottom: 6px;
      }

      .message-bubble {
        padding: 12px 15px;
        border-radius: 12px;
        line-height: 1.6;
        max-width: 85%;
        width: fit-content;
        white-space: pre-wrap;
      }

      .message.agent .message-bubble {
        min-width: 200px;
        max-width: 85%;
      }

      .message.user .message-bubble {
        max-width: 70%;
      }

      /* User message */
      .message.user {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .message.user .message-label {
        color: #22d3ee;
      }

      .message.user .message-bubble {
        background: #22d3ee;
        color: #0f172a;
      }

      /* Agent message */
      .message.agent .message-label {
        color: #22d3ee;
      }

      .message.agent .message-bubble {
        background: #1e293b;
        color: #e2e8f0;
      }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
      };
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      async
    ></script>
  </head>

  <body>
    <div class="container">
      <h1>🛡️ Secure AI Agent</h1>

      <p class="subtitle">Test a security-focused AI math agent.</p>

      <div class="card">
        <label for="apiKey">Gemini API Key</label>

        <input type="password" id="apiKey" placeholder="Enter your API key" />

        <button onclick="initializeAgent()">Initialize Agent</button>

        <div class="status" id="status">Agent not initialized</div>

        <div id="chat"></div>

        <textarea
          id="message"
          rows="3"
          placeholder="Initialize the agent first..."
          disabled
        ></textarea>

        <button onclick="sendMessage()" id="sendButton" disabled>Send</button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
